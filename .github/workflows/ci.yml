name: rust-reference-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master reviewed 2026-10-24
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Verify Phase A src/ immutability
        run: git diff --exit-code src/
      - name: Check formatting across all 4 Cargo manifests and standalone probes
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            Cargo.toml \
            cloud_experiments/lexbor_adapter/Cargo.toml \
            cloud_experiments/mcp_sdk/rust/Cargo.toml \
            cloud_experiments/athena_cloudbench/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
          done
          rustfmt --edition 2024 --check \
            cloud_experiments/bench.rs \
            cloud_experiments/core_probe.rs \
            cloud_experiments/service_probe.rs
      - name: Build pinned Lexbor static library and export environment for audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/athena-lexbor-audit
          bash cloud_experiments/lexbor/build_and_smoke.sh /tmp/athena-lexbor-audit
          lib_dir="/tmp/athena-lexbor-audit/install-none/lib"
          if [[ ! -f "${lib_dir}/liblexbor_static.a" && -f "/tmp/athena-lexbor-audit/install-none/lib64/liblexbor_static.a" ]]; then
            lib_dir="/tmp/athena-lexbor-audit/install-none/lib64"
          fi
          inc_dir="/tmp/athena-lexbor-audit/install-none/include"
          archive="/tmp/athena-lexbor-audit/lexbor-2ae88a1c6b5261830eff73ee12bb3cdf805f3cfe.zip"
          test -f "${lib_dir}/liblexbor_static.a"
          test -d "${inc_dir}/lexbor"
          test -f "${archive}"
          {
            echo "ATHENA_LEXBOR_LIB_DIR=${lib_dir}"
            echo "ATHENA_LEXBOR_INCLUDE_DIR=${inc_dir}"
            echo "ATHENA_LEXBOR_ARCHIVE=${archive}"
          } >> "$GITHUB_ENV"
      - name: Run Clippy (-D warnings) across all 4 Cargo manifests
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --features research-probes -- -D warnings
          cargo clippy --locked --manifest-path cloud_experiments/lexbor_adapter/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path cloud_experiments/mcp_sdk/rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path cloud_experiments/athena_cloudbench/Cargo.toml --all-targets -- -D warnings
      - name: Run locked Rust test suites across all 4 Cargo manifests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets --features research-probes
          cargo test --locked --manifest-path cloud_experiments/lexbor_adapter/Cargo.toml
          cargo test --locked --manifest-path cloud_experiments/mcp_sdk/rust/Cargo.toml
          cargo test --locked --manifest-path cloud_experiments/athena_cloudbench/Cargo.toml
      - run: cargo build --locked --release --features research-probes

  linux-platform-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master reviewed 2026-10-24
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Enable unprivileged user namespaces for Linux isolation gates
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --net --pid --fork --kill-child true
      - name: Install numerical test dependency
        run: timeout --kill-after=15s 300s python -m pip install --disable-pip-version-check --no-input --no-cache-dir numpy==1.26.4
      - name: Check Linux entrypoint syntax
        run: bash -n cloud_experiments/bootstrap.sh cloud_experiments/finish.sh cloud_experiments/lexbor/build_and_smoke.sh
      - name: Build probe, Lexbor, CloudBench twins, and MCP SDK fixtures for zero-skip Linux harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/athena-lexbor-ci
          timeout --kill-after=15s 300s bash cloud_experiments/lexbor/build_and_smoke.sh /tmp/athena-lexbor-ci
          lib_dir="/tmp/athena-lexbor-ci/install-none/lib"
          if [[ ! -f "${lib_dir}/liblexbor_static.a" && -f "/tmp/athena-lexbor-ci/install-none/lib64/liblexbor_static.a" ]]; then
            lib_dir="/tmp/athena-lexbor-ci/install-none/lib64"
          fi
          inc_dir="/tmp/athena-lexbor-ci/install-none/include"
          archive="/tmp/athena-lexbor-ci/lexbor-2ae88a1c6b5261830eff73ee12bb3cdf805f3cfe.zip"
          test -f "${lib_dir}/liblexbor_static.a"
          test -d "${inc_dir}/lexbor"
          test -f "${archive}"
          export ATHENA_LEXBOR_LIB_DIR="${lib_dir}"
          export ATHENA_LEXBOR_INCLUDE_DIR="${inc_dir}"
          export ATHENA_LEXBOR_ARCHIVE="${archive}"
          {
            echo "ATHENA_LEXBOR_LIB_DIR=${lib_dir}"
            echo "ATHENA_LEXBOR_INCLUDE_DIR=${inc_dir}"
            echo "ATHENA_LEXBOR_ARCHIVE=${archive}"
          } >> "$GITHUB_ENV"
          timeout --kill-after=15s 300s cargo fetch --locked
          timeout --kill-after=15s 600s cargo build --locked --release --features research-probes --bin core_probe
          timeout --kill-after=15s 600s cargo build --manifest-path cloud_experiments/mcp_sdk/rust/Cargo.toml --locked --release
          timeout --kill-after=15s 600s cargo build --manifest-path cloud_experiments/athena_cloudbench/Cargo.toml --locked --release
          timeout --kill-after=15s 300s npm --prefix cloud_experiments/mcp_sdk/typescript ci --ignore-scripts --no-audit --no-fund
      - name: Run Linux-only process and service boundaries
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=15s 300s python - <<'PY'
          import sys
          import unittest

          names = [
              "cloud_experiments.test_campaign.HttpDeadlineControls.test_killed_parent_cannot_leave_an_active_credential_worker",
              "cloud_experiments.test_lifecycle.LifecycleControls.test_linux_timeout_reaps_descendant_group_and_reports_its_memory",
              "cloud_experiments.test_lifecycle.LifecycleControls.test_linux_isolated_worker_blocks_egress_keeps_tls_loopback_and_kills_escaped_descendants",
              "cloud_experiments.service_lab.OracleTests.test_probe_output_cap_is_enforced_and_failed_fixture_is_removed",
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print("Linux platform gate skipped a required test", file=sys.stderr)
              raise SystemExit(2)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Run bounded campaign, lifecycle, and protocol suites
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=30s 900s python -B -m unittest \
            cloud_experiments.test_campaign \
            cloud_experiments.test_lifecycle \
            cloud_experiments.service_lab \
            cloud_experiments.mcp_sdk.test_driver \
            cloud_experiments.test_wceb \
            cloud_experiments.test_wceb_runner \
            kaggle_experiments.test_protocol \
            model.test_models \
            model.test_benchmark -v 2>&1 | tee linux-harness.log
      - name: Verify no platform skips in the Linux harness
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^OK \(skipped=[1-9][0-9]*\)' linux-harness.log; then
            echo 'A Linux harness test was skipped; this is not a platform closure.' >&2
            exit 1
          fi
      - name: Prepare a bounded native study manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf linux-prepared
          timeout --kill-after=15s 300s python -B -m cloud_experiments.research prepare linux-prepared --wall-seconds 1500
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("linux-prepared")
          spec = json.loads((folder / "spec.json").read_text(encoding="utf-8"))
          archive = folder / "source.tgz"
          assert spec["protocol"] == "athena-core-research/2"
          assert spec["study_id"] and spec["limits"]["wall_seconds"] == 1500
          assert archive.is_file() and archive.stat().st_size <= 16 * 1024 ** 2
          print({"study_id": spec["study_id"], "archive_bytes": archive.stat().st_size,
                 "variant_count": len(spec["variants"])})
          PY
      - name: Collect bounded diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 120s python -B -m cloud_experiments.campaign audit-decisions > linux-audit.json
          timeout --kill-after=10s 120s python -B -m cloud_experiments.research inventory > linux-inventory.json
          timeout --kill-after=10s 30s rustc -Vv > rust-version.txt
          timeout --kill-after=10s 120s cargo metadata --locked --format-version 1 > cargo-metadata.json
      - name: Upload Linux gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athena-linux-gates-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            linux-harness.log
            linux-prepared/spec.json
            linux-prepared/source.tgz
            linux-audit.json
            linux-inventory.json
            rust-version.txt
            cargo-metadata.json

  linux-arm64-gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master reviewed 2026-10-24
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Verify native aarch64-unknown-linux-gnu Lexbor smoke and 4-manifest tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/athena-lexbor-arm64
          bash cloud_experiments/lexbor/build_and_smoke.sh /tmp/athena-lexbor-arm64
          lib_dir="/tmp/athena-lexbor-arm64/install-none/lib"
          if [[ ! -f "${lib_dir}/liblexbor_static.a" && -f "/tmp/athena-lexbor-arm64/install-none/lib64/liblexbor_static.a" ]]; then
            lib_dir="/tmp/athena-lexbor-arm64/install-none/lib64"
          fi
          inc_dir="/tmp/athena-lexbor-arm64/install-none/include"
          archive="/tmp/athena-lexbor-arm64/lexbor-2ae88a1c6b5261830eff73ee12bb3cdf805f3cfe.zip"
          test -f "${lib_dir}/liblexbor_static.a"
          test -d "${inc_dir}/lexbor"
          test -f "${archive}"
          export ATHENA_LEXBOR_LIB_DIR="${lib_dir}"
          export ATHENA_LEXBOR_INCLUDE_DIR="${inc_dir}"
          export ATHENA_LEXBOR_ARCHIVE="${archive}"
          {
            echo "ATHENA_LEXBOR_LIB_DIR=${lib_dir}"
            echo "ATHENA_LEXBOR_INCLUDE_DIR=${inc_dir}"
            echo "ATHENA_LEXBOR_ARCHIVE=${archive}"
          } >> "$GITHUB_ENV"
          cargo test --locked --all-targets --features research-probes
          cargo test --locked --manifest-path cloud_experiments/lexbor_adapter/Cargo.toml
          cargo test --locked --manifest-path cloud_experiments/mcp_sdk/rust/Cargo.toml
          cargo test --locked --manifest-path cloud_experiments/athena_cloudbench/Cargo.toml

  nightly-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master reviewed 2026-10-24
        with:
          toolchain: 'nightly-2026-10-24'
          components: miri, rust-src, llvm-tools-preview
      - name: Run C + Rust ASAN/UBSAN and TSAN smoke on Lexbor shim
        shell: bash
        env:
          CC: clang
          CARGO_BUILD_JOBS: '3'
        run: |
          set -euo pipefail
          rm -rf /tmp/athena-lexbor-asan /tmp/athena-lexbor-tsan
          ATHENA_LEXBOR_SANITIZER=address_undefined bash cloud_experiments/lexbor/build_and_smoke.sh /tmp/athena-lexbor-asan
          archive="/tmp/athena-lexbor-asan/lexbor-2ae88a1c6b5261830eff73ee12bb3cdf805f3cfe.zip"
          test -f "${archive}"
          ATHENA_LEXBOR_ARCHIVE_CACHE="${archive}" ATHENA_LEXBOR_SANITIZER=thread bash cloud_experiments/lexbor/build_and_smoke.sh /tmp/athena-lexbor-tsan
          asan_lib_dir="/tmp/athena-lexbor-asan/install-address_undefined/lib"
          if [[ ! -f "${asan_lib_dir}/liblexbor_static.a" && -f "/tmp/athena-lexbor-asan/install-address_undefined/lib64/liblexbor_static.a" ]]; then
            asan_lib_dir="/tmp/athena-lexbor-asan/install-address_undefined/lib64"
          fi
          asan_inc_dir="/tmp/athena-lexbor-asan/install-address_undefined/include"
          tsan_lib_dir="/tmp/athena-lexbor-tsan/install-thread/lib"
          if [[ ! -f "${tsan_lib_dir}/liblexbor_static.a" && -f "/tmp/athena-lexbor-tsan/install-thread/lib64/liblexbor_static.a" ]]; then
            tsan_lib_dir="/tmp/athena-lexbor-tsan/install-thread/lib64"
          fi
          tsan_inc_dir="/tmp/athena-lexbor-tsan/install-thread/include"
          test -f "${asan_lib_dir}/liblexbor_static.a"
          test -d "${asan_inc_dir}/lexbor"
          test -f "${tsan_lib_dir}/liblexbor_static.a"
          test -d "${tsan_inc_dir}/lexbor"
          {
            echo "ATHENA_LEXBOR_LIB_DIR=${asan_lib_dir}"
            echo "ATHENA_LEXBOR_INCLUDE_DIR=${asan_inc_dir}"
            echo "ATHENA_LEXBOR_ARCHIVE=${archive}"
            echo "ATHENA_LEXBOR_TSAN_LIB_DIR=${tsan_lib_dir}"
            echo "ATHENA_LEXBOR_TSAN_INCLUDE_DIR=${tsan_inc_dir}"
          } >> "$GITHUB_ENV"
      - name: Run AddressSanitizer + LeakSanitizer on Lexbor FFI adapter and CloudBench
        shell: bash
        env:
          CC: clang
          ATHENA_LEXBOR_SANITIZER: address_undefined
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker=clang -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          cargo test --locked --target x86_64-unknown-linux-gnu \
            --manifest-path cloud_experiments/lexbor_adapter/Cargo.toml \
            --all-targets
          cargo test --locked --target x86_64-unknown-linux-gnu \
            --manifest-path cloud_experiments/athena_cloudbench/Cargo.toml \
            --lib
      - name: Run ThreadSanitizer on SingleFlight, SourceCache, and Bandit concurrency primitives
        shell: bash
        env:
          CC: clang
          ATHENA_LEXBOR_LIB_DIR: ${{ env.ATHENA_LEXBOR_TSAN_LIB_DIR }}
          ATHENA_LEXBOR_INCLUDE_DIR: ${{ env.ATHENA_LEXBOR_TSAN_INCLUDE_DIR }}
          ATHENA_LEXBOR_ARCHIVE: ${{ env.ATHENA_LEXBOR_ARCHIVE }}
          ATHENA_LEXBOR_SANITIZER: thread
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C linker=clang -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- singleflight
          cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- bandit
          cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- orchestrator
      - name: Run pure-Rust Miri undefined-behavior gate
        shell: bash
        run: |
          set -euo pipefail
          MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test \
            --locked \
            --manifest-path cloud_experiments/athena_cloudbench/Cargo.toml \
            --no-default-features \
            --lib
