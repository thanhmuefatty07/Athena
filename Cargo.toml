[package]
name = "athena-core-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Audited reference vertical slice for permissioned, freshness-aware agent retrieval"

[dependencies]
bytes = "1.10"
blake3 = "1.8"
rand = "0.9"
rand_distr = "0.5"
html5ever = "=0.39.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"], optional = true }
scraper = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
url = "2.5"
futures-util = "0.3"

[dev-dependencies]

[features]
default = ["tls-aws-lc"]
tls-aws-lc = ["reqwest/rustls"]
tls-ring = ["reqwest/rustls-no-provider", "dep:rustls", "rustls/ring"]
research-probes = []

[[bin]]
name = "core_probe"
path = "cloud_experiments/core_probe.rs"
required-features = ["research-probes"]

[profile.release]
lto = "thin"
codegen-units = 8
panic = "unwind"

[profile.bench]
inherits = "release"
